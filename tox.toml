env_list = ["ruff", "black", "mypy", "docs", "py310", "py311", "py312", "py313", "py314"]

[env_run_base]
default_base_python = "3.10"
deps = [
    "pytest",
    "coverage",
]
commands = [
    ["coverage", "run", "-m", "pytest"],
    ["coverage", "combine"],
    ["coverage", "xml"],
    ["coverage", "report"],
]
set_env = { PYTHONDEVMODE = "1" }

[env.ruff]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "src/", "tests/", "setup.py"]]

[env.black]
deps = ["black==22.3.0"]
skip_install = true
commands = [["black", "--check", "src/", "tests/", "doc/", "helpers/", "setup.py"]]

[env.mypy]
deps = ["mypy", "pytest"]
commands = [["mypy", "src/", "tests/"]]

[env.asan]
set_env = {PYTHONDEVMODE="1", PYTHONMALLOC="malloc", CFLAGS="-lasan -fsanitize=address -fno-omit-frame-pointer"}
allowlist_externals = ["bash"]
commands = [
    ["bash", "-c", "export LD_PRELOAD=$(gcc -print-file-name=libasan.so) && printenv LD_PRELOAD && python -c 'import dnaio' && pytest tests"]
]

[env.docs]
changedir = "doc"
deps = ["-r doc/requirements.txt"]
commands = [
    ["sphinx-build", "-W", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/html"]
]
